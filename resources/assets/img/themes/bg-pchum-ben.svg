<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Moul&amp;family=Kantumruy+Pro:wght@700&amp;display=swap');
    </style>
    <!-- Sacred Water & Pond Gradient (Serene Emerald Jade) -->
    <linearGradient id="pb-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021712" />
      <stop offset="35%" stop-color="#04261f" />
      <stop offset="70%" stop-color="#06382e" />
      <stop offset="100%" stop-color="#021712" />
    </linearGradient>

    <!-- Center UI Readability Darkening Radial Gradient -->
    <radialGradient id="pb-center-wash" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#021712" stop-opacity="0.82" />
      <stop offset="50%" stop-color="#021712" stop-opacity="0.65" />
      <stop offset="80%" stop-color="#021712" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#021712" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Temple Roof Gradient -->
    <linearGradient id="temple-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Lotus Blossom Gradient -->
    <linearGradient id="lotus-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fbcfe8" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Lily Pad Shading -->
    <radialGradient id="lily-pad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="90%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Steel Tiffin Metallic Gradient -->
    <linearGradient id="steel-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Banana Leaf Green -->
    <linearGradient id="banana-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="60%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>
  </defs>

  <!-- Deep Emerald Pond Base -->
  <rect width="1600" height="900" fill="url(#pb-water)" />

  <!-- Calming Water Ripples -->
  <g opacity="0.3">
    <ellipse cx="1320" cy="240" rx="340" ry="120" fill="none" stroke="#5eead4" stroke-width="1.5" />
    <ellipse cx="1320" cy="240" rx="420" ry="150" fill="none" stroke="#2dd4bf" stroke-width="1" />
    <ellipse cx="320" cy="680" rx="320" ry="110" fill="none" stroke="#5eead4" stroke-width="1.5" />
  </g>

  <!-- ===================================================================== -->
  <!-- LUSH LOTUS LILY PADS FRAMING THE CORNERS & PERIPHERY                  -->
  <!-- ===================================================================== -->
  <!-- Pad 1: Top Left Corner -->
  <g transform="translate(140, 140) scale(0.9)">
    <ellipse cx="10" cy="15" rx="150" ry="125" fill="#01140f" opacity="0.55" />
    <ellipse cx="0" cy="0" rx="150" ry="125" fill="url(#lily-pad)" />
    <polygon points="0,0 60,-130 10,-132" fill="url(#pb-water)" />
    <circle cx="0" cy="0" r="7" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Pad 2: Left Side -->
  <g transform="translate(80, 420) scale(0.8)">
    <ellipse cx="8" cy="12" rx="140" ry="115" fill="#01140f" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="115" fill="url(#lily-pad)" />
    <polygon points="0,0 -80,-90 -20,-105" fill="url(#pb-water)" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Pad 3: Bottom Left Corner -->
  <g transform="translate(180, 780) scale(1.05)">
    <ellipse cx="10" cy="16" rx="160" ry="130" fill="#01140f" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="160" ry="130" fill="url(#lily-pad)" />
    <polygon points="0,0 -110,-75 -60,-120" fill="url(#pb-water)" />
    <circle cx="0" cy="0" r="7" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Pad 4: Bottom Right Corner -->
  <g transform="translate(1440, 760) scale(1.1)">
    <ellipse cx="12" cy="18" rx="165" ry="135" fill="#01140f" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="165" ry="135" fill="url(#lily-pad)" />
    <polygon points="0,0 110,-80 50,-125" fill="url(#pb-water)" />
    <circle cx="0" cy="0" r="8" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- Pad 5: Far Right Middle -->
  <g transform="translate(1520, 460) scale(0.85)">
    <ellipse cx="8" cy="12" rx="135" ry="110" fill="#01140f" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="135" ry="110" fill="url(#lily-pad)" />
    <polygon points="0,0 -70,95 -15,110" fill="url(#pb-water)" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- ===================================================================== -->
  <!-- TOP RIGHT: FLOATING GOLDEN KHMER VIHEAR / SANCTUARY (From Behance)    -->
  <!-- ===================================================================== -->
  <g transform="translate(1320, 200) scale(0.85)">
    <!-- Wooden Stilt Pilings into Water -->
    <g fill="#291404" opacity="0.85">
      <rect x="-130" y="105" width="12" height="42" />
      <rect x="-70" y="110" width="12" height="40" />
      <rect x="0" y="112" width="12" height="38" />
      <rect x="70" y="110" width="12" height="40" />
      <rect x="130" y="105" width="12" height="42" />
    </g>

    <!-- Platform Pier Deck -->
    <polygon points="-150,105 0,58 150,105 0,145" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <polygon points="-150,105 0,145 0,158 -150,118" fill="#451a03" />
    <polygon points="150,105 0,145 0,158 150,118" fill="#291404" />

    <!-- Temple White/Gold Walls -->
    <polygon points="-100,62 0,24 100,62 0,100" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <polygon points="-100,62 0,100 0,35 -100,-2" fill="#fef3c7" />
    <polygon points="100,62 0,100 0,35 100,-2" fill="#fde68a" />

    <!-- Pillars -->
    <g fill="#d97706" stroke="#92400e" stroke-width="1">
      <rect x="-85" y="10" width="7" height="55" />
      <rect x="-55" y="16" width="7" height="60" />
      <rect x="-25" y="24" width="7" height="65" />
      <rect x="5" y="24" width="7" height="65" />
      <rect x="35" y="16" width="7" height="60" />
      <rect x="65" y="10" width="7" height="55" />
    </g>

    <!-- Multi-Tiered Golden Roofs -->
    <!-- Tier 1 -->
    <polygon points="-130,-12 0,-55 130,-12 0,20" fill="url(#temple-gold)" stroke="#78350f" stroke-width="2" />
    <path d="M-130,-12 Q-152,-30 -142,-48 Q-132,-35 -122,-18 Z" fill="#f59e0b" stroke="#78350f" />
    <path d="M130,-12 Q152,-30 142,-48 Q132,-35 122,-18 Z" fill="#f59e0b" stroke="#78350f" />

    <!-- Tier 2 -->
    <polygon points="-105,-45 0,-82 105,-45 0,-18" fill="url(#temple-gold)" stroke="#78350f" stroke-width="2" />
    <path d="M-105,-45 Q-122,-60 -115,-76 Q-108,-64 -98,-48 Z" fill="#f59e0b" stroke="#78350f" />
    <path d="M105,-45 Q122,-60 115,-76 Q108,-64 98,-48 Z" fill="#f59e0b" stroke="#78350f" />

    <!-- Tier 3 & Soaring Central Golden Spire -->
    <polygon points="-75,-78 0,-110 75,-78 0,-55" fill="url(#temple-gold)" stroke="#78350f" stroke-width="2" />
    <path d="M-12,-108 L0,-195 L12,-108 Z" fill="url(#temple-gold)" stroke="#78350f" stroke-width="1.5" />
    <circle cx="0" cy="-195" r="4.5" fill="#fef08a" />
    <circle cx="0" cy="-160" r="8" fill="#f59e0b" />
    <circle cx="0" cy="-132" r="11" fill="#f59e0b" />
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM LEFT: TRADITIONAL TIFFIN CARRIER (ចានស្រាក់ - CHAN SRAK)       -->
  <!-- ===================================================================== -->
  <g transform="translate(140, 640) scale(0.8)">
    <ellipse cx="20" cy="175" rx="80" ry="22" fill="#01120d" opacity="0.6" />

    <!-- Banana Leaf Wrap -->
    <path d="M-55,65 C-88,38 -100,-18 -65,-55 C-38,-38 -45,18 -55,65 Z" fill="url(#banana-leaf)" stroke="#365314" stroke-width="1.5" />

    <!-- 3 Tiered Stainless Steel Tiffin -->
    <rect x="-42" y="100" width="120" height="44" rx="7" fill="url(#steel-metal)" stroke="#475569" stroke-width="2" />
    <rect x="-42" y="52" width="120" height="44" rx="7" fill="url(#steel-metal)" stroke="#475569" stroke-width="2" />
    <rect x="-42" y="5" width="120" height="44" rx="7" fill="url(#steel-metal)" stroke="#475569" stroke-width="2" />
    <path d="M-42,6 Q18,-15 78,6 Z" fill="url(#steel-metal)" stroke="#475569" stroke-width="2" />

    <!-- Steel Carrying Frame & Arch Handle -->
    <g fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round">
      <line x1="-46" y1="125" x2="-46" y2="0" />
      <line x1="82" y1="125" x2="82" y2="0" />
      <path d="M-46,0 C-46,-65 82,-65 82,0" />
    </g>
    <rect x="3" y="-58" width="32" height="10" rx="3" fill="#92400e" stroke="#451a03" stroke-width="1" />

    <!-- Lotus Bud Offering -->
    <g transform="translate(45, -35) rotate(22) scale(0.6)">
      <path d="M0,0 C-15,-18 -15,-36 0,-54 C15,-36 15,-18 0,0 Z" fill="url(#lotus-pink)" stroke="#be185d" />
      <line x1="0" y1="0" x2="0" y2="22" stroke="#65a30d" stroke-width="2.5" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- BLOOMING LOTUS FLOWERS (Pink Lotus Blossoms Floating on Water)        -->
  <!-- ===================================================================== -->
  <!-- Lotus 1: Top Left -->
  <g transform="translate(260, 200) scale(0.85)">
    <g fill="url(#lotus-pink)" stroke="#be185d" stroke-width="0.8">
      <path d="M0,15 C-30,15 -50,-10 -30,-32 C-18,-12 -8,0 0,15 Z" />
      <path d="M0,15 C30,15 50,-10 30,-32 C18,-12 8,0 0,15 Z" />
      <path d="M0,15 C-18,-5 -22,-50 0,-60 C22,-50 18,-5 0,15 Z" fill="#ffffff" />
      <path d="M0,15 C-10,-8 -12,-40 0,-48 C12,-40 10,-8 0,15 Z" fill="#fbcfe8" />
    </g>
    <ellipse cx="0" cy="-8" rx="9" ry="6" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
  </g>

  <!-- Lotus 2: Bottom Right -->
  <g transform="translate(1320, 720) scale(1.05)">
    <g fill="url(#lotus-pink)" stroke="#be185d" stroke-width="0.8">
      <path d="M0,15 C-32,15 -52,-10 -32,-34 C-18,-14 -8,0 0,15 Z" />
      <path d="M0,15 C32,15 52,-10 32,-34 C18,-14 8,0 0,15 Z" />
      <path d="M0,15 C-18,-5 -22,-52 0,-62 C22,-52 18,-5 0,15 Z" fill="#ffffff" />
    </g>
    <ellipse cx="0" cy="-10" rx="10" ry="7" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
  </g>

  <!-- ===================================================================== -->
  <!-- TOP CENTER EMBLEM: REFINED PCHUM BEN SCRIPT                           -->
  <!-- ===================================================================== -->
  <g transform="translate(800, 112)" opacity="0.92">
    <ellipse cx="0" cy="8" rx="260" ry="48" fill="#021712" opacity="0.75" />
    <text x="0" y="4" 
          font-family="'Moul', 'Khmer OS Muol', 'Khmer Sangam MN', 'Khmer MN', 'Kantumruy Pro', 'Noto Sans Khmer', system-ui, sans-serif" 
          font-size="34" 
          font-weight="700" 
          text-anchor="middle" 
          fill="#f59e0b" 
          filter="drop-shadow(0px 2px 10px rgba(0,0,0,0.85))">
      ភ្ជំបិណ្ឌ
    </text>
    <text x="0" y="34" 
          font-family="'Outfit', 'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          text-anchor="middle" 
          fill="#5eead4" 
          letter-spacing="6" 
          opacity="0.9">
      PCHUM BEN FESTIVAL • ANCESTORS' DAY
    </text>
  </g>

  <!-- Central Reading Wash: Softly dims center to guarantee 100% UI clarity -->
  <rect width="1600" height="900" fill="url(#pb-center-wash)" pointer-events="none" />

  <!-- Bottom Mist for Music Player Bar -->
  <linearGradient id="pb-bar-mist" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#021712" stop-opacity="0" />
    <stop offset="60%" stop-color="#021712" stop-opacity="0.5" />
    <stop offset="100%" stop-color="#021712" stop-opacity="0.88" />
  </linearGradient>
  <rect y="680" width="1600" height="220" fill="url(#pb-bar-mist)" pointer-events="none" />
</svg>
